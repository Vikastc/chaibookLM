# Full-stack Docker Compose for local development and self-hosting.
#
# Usage:
#   cp server/.env.example server/.env   # fill in your API keys
#   docker compose up --build
#
# Services:
#   postgres  → localhost:5435
#   server    → http://localhost:8080
#   client    → http://localhost:3001

services:
  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chaibooklm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaibooklm
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaibooklm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Express API ────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chaibooklm-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Override DB host so it resolves to the postgres service, not localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chaibooklm
      PORT: 8080
      # Point CORS allowed origin at the client container
      CLIENT_URL: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Next.js Client ─────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Bakes the proxy rewrite into the Next.js bundle at build time.
        # "server" resolves to the Express container on Docker's internal network.
        # The browser always talks to localhost:3001; Next.js proxies /api/* internally.
        API_ORIGIN: http://server:8080
    container_name: chaibooklm-client
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
