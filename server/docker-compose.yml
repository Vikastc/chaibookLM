# This file starts a local Postgres instance only — useful when you want to run
# the Express server with `npm run dev` (not Docker) but still need a database.
#
# To run the FULL stack (postgres + server + client) use the root-level
# docker-compose.yml instead:
#
#   cd ..  &&  docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: chaibooklm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaibooklm
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaibooklm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
